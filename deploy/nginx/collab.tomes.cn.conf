# =============================================================
# collab.tomes.cn — 协作平台同源网关（M3 生产指南 §2 模板）
# 前端静态 + /api 反代后端 + OnlyOffice 同域代理（Host 保留）
# SSL 由 certbot --nginx 自动追加（/etc/letsencrypt），勿手改 443 段
# =============================================================
server {
    listen 80;
    listen [::]:80;
    server_name collab.tomes.cn;

    # 上传限制：与后端 MAX_UPLOAD_SIZE_MB(200) 对齐
    client_max_body_size 200m;

    # ---- 前端静态（Vue SPA 构建产物）----
    root /var/www/collab-web;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 健康检查（供监控/探活）
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ---- OnlyOffice 同域代理（必须保留 Host，OnlyOffice 据此生成同源资源 URL）----
    # 前端显式加载 api.js 的入口（去前缀转发）
    location /onlyoffice-doc/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # OnlyOffice 内部资源 / 编辑器 iframe / 协同编辑缓存（绝对路径）
    location /web-apps/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /cache/files/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 协同编辑 WebSocket
    location /coauthoring/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
