# =============================================================
# collaboration-web — nginx 站点（SPA + /api 反代后端 + Openfire BOSH/WS + OnlyOffice 同域代理）
# 容器内上游：backend:8000 / openfire:7070 / onlyoffice:80
# 说明：openfire/onlyoffice 为可选组件，反代用「变量 + resolver」延迟解析，
#       避免其不在线时 nginx 启动即崩溃（host not found in upstream）。
# =============================================================
server {
    listen 80;
    # HTTPS：手机跨机（http://<局域网IP>:8080）是非安全上下文，navigator.mediaDevices 为
    # undefined、getUserMedia 被浏览器禁止 → 音视频通话「无任何反应」。必须走 HTTPS 才有安全上下文。
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.crt;
    ssl_certificate_key /etc/nginx/certs/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩：converse.min.js(1.3MB)/converse.min.css(545KB) 未压缩传输是 IM 页首次加载慢主因之一
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/wasm
        image/svg+xml;

    # 上传限制：与后端 MAX_UPLOAD_SIZE_MB(200) 对齐
    client_max_body_size 200m;

    # Docker 内置 DNS（变量 proxy_pass 运行时解析用）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- 前端静态（Vue SPA）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（SPA 入口随构建变化，指向带 hash 的新 chunk）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # 带 hash 的构建产物长期缓存（文件名 hash 变更即失效）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 后端 API（主栈，direct 直连）----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- 健康检查 ----
    location = /healthz {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ---- Openfire XMPP：BOSH（HTTP-Bind，converse.js 连接，长轮询需关闭缓冲）----
    location /http-bind/ {
        set $openfire http://openfire:7070;
        proxy_pass $openfire/http-bind/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
    }
    # ---- Openfire XMPP：WebSocket（备用通道）----
    location /ws/ {
        set $openfire http://openfire:7070;
        proxy_pass $openfire/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- Openfire HTTP File Upload（XEP-0363 附件上传，announced URL 指向此反代）----
    # 插件的 Jetty handler 通过 HttpBindManager.addJettyHandler 挂载在 HTTP-Bind 端口（7070），
    # 与 BOSH 共用 7070、靠 context path（/httpfileupload vs /http-bind）区分。
    location /httpfileupload/ {
        set $openfire_http http://openfire:7070;
        # 注意：proxy_pass 用变量时不能带 URI 后缀（否则 nginx 会整体替换 URI，
        # 丢失 slot 的 UUID 路径段）。不带 URI 则原样转发完整 /httpfileupload/<uuid>/<name>。
        proxy_pass $openfire_http;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200m;
    }

    # ---- OnlyOffice 同域代理（可选组件，变量延迟解析）----
    # Host 用 $http_host（含端口）：OnlyOffice 对版本化静态资源返回 302，
    # Location 基于 Host 生成，若不含端口浏览器会请求 80 端口导致资源加载失败。
    location /onlyoffice-doc/ {
        set $onlyoffice http://onlyoffice:80;
        # 变量 proxy_pass 不能带 URI 尾斜杠（会把请求转发成根路径 /，OnlyOffice 对 / 返回 302 到 /welcome/）
        # 改为 rewrite 去掉 /onlyoffice-doc/ 前缀 + proxy_pass 不带 URI（转发改写后的完整路径）
        rewrite ^/onlyoffice-doc/(.*)$ /$1 break;
        proxy_pass $onlyoffice;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 版本化静态资源：/9.4.0-<hash>/web-apps/... （OnlyOffice 把 /web-apps/ 302 重定向到这里）
    location ~ ^/[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]+/ {
        set $onlyoffice http://onlyoffice:80;
        proxy_pass $onlyoffice;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /web-apps/ {
        set $onlyoffice http://onlyoffice:80;
        proxy_pass $onlyoffice;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /cache/files/ {
        set $onlyoffice http://onlyoffice:80;
        proxy_pass $onlyoffice;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /coauthoring/ {
        set $onlyoffice http://onlyoffice:80;
        proxy_pass $onlyoffice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }
}
