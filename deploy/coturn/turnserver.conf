# coturn STUN/TURN server 配置（collaboration 平台 Openfire 音视频通话媒体中继）
# 端口 +10000 偏移，避免与 openfire-coturn（3478/5349/49160-49200）冲突；
# relay 端口容器内外 1:1 映射，保证 TURN 分配给客户端的 relay 地址真实可达。

listening-port=13478
tls-listening-port=15349

fingerprint
lt-cred-mech
realm=xmpp.collab.local
server-name=xmpp.collab.local

# 对外地址映射：外网（宿主机 Mac 局域网 IP）/ 内网（容器固定 IP 172.30.0.10）。
# Mac 局域网 IP 随 WiFi 切换变化，切网后需同步更新此处（见 memory）。
external-ip=192.168.31.19/172.30.0.10

# 显式指定 relay 地址（IPv4）：coturn 默认会初始化 IPv6 relay（relay ::1），在 Docker
# 环境卡住 → turnserver 永远停在「relay ::1 initialization」不进入监听状态、STUN/TURN 无响应。
# 注意：不要加 listening-ip=0.0.0.0——会让 coturn 只开 TCP 不开 UDP（STUN 走 UDP 会超时）。
relay-ip=172.30.0.10
listening-ip=0.0.0.0

# 静态 TURN 用户（前端 WebRTC iceServers 用相同 user/credential）
user=collab:collab@123

# relay 端口段（+10000 偏移，容器内外 1:1）
min-port=59160
max-port=59200

# 本地开发关闭 TLS 证书强制（前端用非 TLS turn: 地址，localhost 属安全上下文）
no-tls
no-dtls

verbose
