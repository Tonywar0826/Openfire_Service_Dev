# =============================================================
# Openfire 服务独立部署编排（Openfire + openfire-db + coturn）
# 用途：协作平台负责人单独安装 / 运行 Openfire IM 服务
# 项目名：openfire-service
#
# 安装步骤见 ../README.md「安装 Openfire 服务」一节，简版：
#   1. cp .env.example .env 并填写 OPENFIRE_DB_PASSWORD 等
#   2. docker build -f openfire.Dockerfile -t openfire-openfire:5.1.2 .
#   3. docker compose up -d
# =============================================================

name: openfire-service

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---- Openfire 独立数据库实例（故障隔离：与平台主库物理隔离）----
  openfire-db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: openfire-db
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${OPENFIRE_USER:-openfire}
      POSTGRES_PASSWORD: ${OPENFIRE_DB_PASSWORD:?OPENFIRE_DB_PASSWORD 必填，请复制 .env.example 为 .env 并修改}
      POSTGRES_DB: ${OPENFIRE_DB:-openfire}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - openfire_dbdata:/var/lib/postgresql/data
    ports:
      - "${OPENFIRE_DB_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENFIRE_USER:-openfire} -d ${OPENFIRE_DB:-openfire}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - collab-net
    logging: *default-logging

  # ---- Openfire XMPP/IM 引擎（5.1.2）----
  openfire:
    image: ${OPENFIRE_IMAGE:-openfire-openfire:5.1.2}
    container_name: openfire
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - openfire_conf:/opt/openfire/conf
      - openfire_plugins:/opt/openfire/plugins
      # 附件上传（XEP-0363）文件持久目录：必须挂卷，否则容器重建后 fileRepo 丢失 → 上传 500
      - openfire_fileupload:/opt/openfire/fileupload
      # 预置 PostgreSQL 连接 + XMPP 域（覆盖镜像默认配置）
      - ./openfire.xml:/opt/openfire/conf/openfire.xml
    ports:
      # 安全加固：关闭明文端口，仅保留 TLS/HTTPS
      - "127.0.0.1:${OPENFIRE_ADMIN_PORT:-19090}:9090"   # Admin Console（HTTP，仅本机）
      - "${OPENFIRE_C2S_TLS_PORT:-15223}:5223"           # XMPP c2s（TLS）
      - "${OPENFIRE_WS_PORT:-17443}:7443"                # WebSocket
      # BOSH 7070 不映射宿主机端口，走 nginx /http-bind/ 反代（见 Openfire-Integration 与 03b 服务集成设计）
    depends_on:
      openfire-db:
        condition: service_healthy
    networks:
      - collab-net
    logging: *default-logging

  # ---- coturn（STUN/TURN，Openfire 音视频通话媒体中继）----
  # Mac Docker Desktop 下容器看不到宿主机 WiFi IP，用固定容器 IP + external-ip 配对映射真实局域网 IP
  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:latest}
    container_name: coturn
    restart: unless-stopped
    init: true
    command: ["-c", "/etc/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    ports:
      # 端口容器内外 1:1 映射（TURN 分配的 relay 地址须真实可达）
      - "13478:13478/tcp"
      - "13478:13478/udp"
      - "15349:15349/tcp"
      - "15349:15349/udp"
      - "59160-59200:59160-59200/udp"
    networks:
      coturn-net:
        ipv4_address: 172.30.0.10
    logging: *default-logging

networks:
  collab-net:
    name: collaboration-development-net
    driver: bridge
  coturn-net:
    name: collaboration-development-coturn
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  openfire_conf:
  openfire_plugins:
  openfire_fileupload:
  openfire_dbdata:
